name: attendance-storage-local

services:
  aistor:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z.hotfix.4ef74f03d6f2@sha256:e3a4c89118a0d02cbef43978172bd2bf4f43b6ba91d3d96618346cdb68bd73e8
    command: ["minio", "server", "/mnt/data", "--address", ":9000", "--console-address", ":9001", "--license", "/minio.license"]
    environment:
      MINIO_ROOT_USER: ${AISTOR_ROOT_USER:?Set AISTOR_ROOT_USER in .env.aistor}
      MINIO_ROOT_PASSWORD: ${AISTOR_ROOT_PASSWORD:?Set AISTOR_ROOT_PASSWORD in .env.aistor}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - aistor_data:/mnt/data
      - type: bind
        source: ../.licenses/minio.license
        target: /minio.license
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  aistor_data:
