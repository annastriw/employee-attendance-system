<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resolve theme before first paint: stored preference wins, else OS.
      // HeroUI reads .dark / data-theme. Keep in sync with @attendance/ui theme controller.
      (function () {
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        function resolve() {
          var pref = null;
          try { pref = localStorage.getItem("theme"); } catch (e) {}
          if (pref !== "light" && pref !== "dark") pref = "system";
          return pref === "system" ? (media.matches ? "dark" : "light") : pref;
        }
        function apply() {
          var theme = resolve();
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.dataset.theme = theme;
        }
        apply();
        // Only follow the OS while the user is on "system".
        media.addEventListener("change", function () {
          var pref = null;
          try { pref = localStorage.getItem("theme"); } catch (e) {}
          if (pref !== "light" && pref !== "dark") apply();
        });
      })();
    </script>
    <title>HR Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
