name: Production images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images
  cancel-in-progress: false

jobs:
  backend-images:
    name: Publish image (${{ matrix.service }})
    needs: [release-metadata]
    if: needs.release-metadata.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        service:
          - api-gateway
          - auth-service
          - employee-service
          - attendance-service
          - media-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image for this commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          push: true
          tags: ghcr.io/annastriw/employee-attendance-system/${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/annastriw/employee-attendance-system
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.service }}

  migration-image:
    name: Publish migration image
    needs: [release-metadata]
    if: needs.release-metadata.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish migration image for this commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.migrator
          push: true
          tags: ghcr.io/annastriw/employee-attendance-system/migrator:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/annastriw/employee-attendance-system
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  release-metadata:
    name: Inspect release changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
      migrations_changed: ${{ steps.changes.outputs.migrations_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect backend and migration changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # A rewritten history can leave the previous release outside fetched refs.
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || \
              git fetch --no-tags origin "$BEFORE_SHA"
          fi
          python3 scripts/deployment/detect-release-changes.py \
            "$BEFORE_SHA" "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy VPS production
    if: vars.VPS_AUTO_DEPLOY_ENABLED == 'true' && needs.release-metadata.outputs.backend_changed == 'true'
    needs: [backend-images, migration-image, release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions: {}
    steps:
      - name: Configure restricted SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/attendance_deploy"
          chmod 600 "$HOME/.ssh/attendance_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy exact main release
        env:
          VPS_DEPLOY_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          MIGRATIONS_CHANGED: ${{ needs.release-metadata.outputs.migrations_changed }}
        run: |
          test -n "$VPS_DEPLOY_HOST"
          test -n "$VPS_DEPLOY_USER"
          ssh \
            -i "$HOME/.ssh/attendance_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$VPS_DEPLOY_USER@$VPS_DEPLOY_HOST" \
            "deploy $RELEASE_SHA $MIGRATIONS_CHANGED"
