name: Production images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images
  cancel-in-progress: false

jobs:
  backend-images:
    name: Publish image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        service:
          - api-gateway
          - auth-service
          - employee-service
          - attendance-service
          - media-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image for this commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          push: true
          tags: ghcr.io/annastriw/employee-attendance-system/${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/annastriw/employee-attendance-system
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: SERVICE=${{ matrix.service }}
          cache-from: type=gha,scope=backend-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.service }}
